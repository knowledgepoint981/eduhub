<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password | Knowledge Point EduHub</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --black: #07110d;
            --black-soft: #0d1914;
            --black-card: #10231a;
            --emerald: #087f5b;
            --emerald-light: #10a875;
            --gold: #d4af37;
            --gold-light: #f0d477;
            --white: #ffffff;
            --muted: #aebbb5;
            --border: rgba(255,255,255,0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(circle at top,
                    rgba(8,127,91,0.20),
                    transparent 35%),
                var(--black);
            color: var(--white);
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 7%;
            border-bottom: 1px solid var(--border);
            background: rgba(7,17,13,0.95);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold);
        }

        .brand-text h1 {
            font-size: 20px;
            color: var(--white);
        }

        .brand-text p {
            margin-top: 4px;
            font-size: 12px;
            color: var(--gold-light);
            letter-spacing: 0.5px;
        }

        main {
            width: 100%;
            max-width: 470px;
            margin: auto;
            padding: 35px 20px;
        }

        .card {
            background: var(--black-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 35px 30px;
            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(212,175,55,0.10);
            border: 1px solid rgba(212,175,55,0.35);
            font-size: 30px;
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: #dce6e1;
            font-weight: 600;
        }

        .field {
            margin-bottom: 18px;
        }

        .password-wrap {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 45px 14px 14px;
            border-radius: 11px;
            border: 1px solid var(--border);
            background: #08150f;
            color: var(--white);
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: var(--emerald-light);
            box-shadow: 0 0 0 3px rgba(16,168,117,0.10);
        }

        .toggle {
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: var(--gold-light);
            cursor: pointer;
            font-size: 16px;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 14px;
            background: linear-gradient(
                135deg,
                var(--emerald),
                var(--emerald-light)
            );
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 5px;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(16,168,117,0.25);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.5;
        }

        .success {
            display: block;
            background: rgba(16,168,117,0.12);
            border: 1px solid rgba(16,168,117,0.30);
            color: #7ce0b8;
        }

        .error {
            display: block;
            background: rgba(220,70,70,0.12);
            border: 1px solid rgba(220,70,70,0.30);
            color: #ff9c9c;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: var(--gold-light);
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #718078;
            font-size: 12px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 20px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">

        <img src="logo.png"
             alt="Knowledge Point EduHub Logo">

        <div class="brand-text">
            <h1>Knowledge Point EduHub</h1>
            <p>Where Knowledge Meets Excellence</p>
        </div>

    </div>
</header>


<main>

    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h2>Reset Password</h2>

        <p class="subtitle">
            Create a new secure password for your
            Knowledge Point EduHub account.
        </p>


        <form id="resetForm">

            <div class="field">

                <label for="password">
                    New Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword('password', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <div class="field">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <div class="password-wrap">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="resetBtn"
            >
                Update Password
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="login.html"
            class="back"
        >
            ← Back to Login
        </a>

    </div>

</main>


<footer>
    © 2026 Knowledge Point EduHub • Where Knowledge Meets Excellence
</footer>


<script>

    /* =========================================================
       SUPABASE CONFIGURATION
    ========================================================= */

    const SUPABASE_URL =
        "https://koheruqspqwvoaovhxkb.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_ER3AShJ0cie9WLYBNHak4g_m3KUTLg7";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* =========================================================
       PASSWORD VISIBILITY
    ========================================================= */

    function togglePassword(
        inputId,
        button
    ) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";
            button.textContent = "🙈";

        } else {

            input.type = "password";
            button.textContent = "👁";

        }

    }


    /* =========================================================
       MESSAGE
    ========================================================= */

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;

    }


    /* =========================================================
       RESET PASSWORD
    ========================================================= */

    document
        .getElementById("resetForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;

                const button =
                    document
                        .getElementById("resetBtn");


                if (password !== confirmPassword) {

                    showMessage(
                        "Passwords do not match.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Password must contain at least 6 characters.",
                        "error"
                    );

                    return;
                }


                button.disabled = true;
                button.textContent =
                    "Updating Password...";


                const {
                    error
                } =
                    await supabaseClient
                        .auth
                        .updateUser({
                            password: password
                        });


                if (error) {

                    console.error(
                        "Password update error:",
                        error
                    );

                    showMessage(
                        error.message,
                        "error"
                    );

                    button.disabled = false;
                    button.textContent =
                        "Update Password";

                    return;
                }


                showMessage(
                    "Password updated successfully! Redirecting to login...",
                    "success"
                );


                await supabaseClient
                    .auth
                    .signOut();


                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    2000
                );

            }
        );

</script>

</body>
</html>
